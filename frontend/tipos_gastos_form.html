<div class="glass" style="width: 500px; padding: 2rem; border-radius: 12px; border: 1px solid rgba(0,0,0,0.1); background: #ffffff; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.15);">
    <h3 style="margin-bottom: 1.5rem; color: var(--text-main); font-weight: 600;">{{ 'Editar Tipo de Gasto' if cat else 'Nuevo Tipo de Gasto' }}</h3>
    <form hx-post="/api/tipos_gastos/save" hx-target="#categorias-list" onsubmit="document.getElementById('modal-container').style.display='none'">
        <input type="hidden" name="id" value="{{ cat.id if cat else '' }}">
        
        <div style="margin-bottom: 1.2rem;">
            <label style="display: block; margin-bottom: 0.5rem; color: var(--text-muted); font-size: 0.85rem; text-transform: uppercase; letter-spacing: 1px;">Nombre:</label>
            <input type="text" name="nombre" value="{{ cat.nombre if cat else '' }}" style="width: 100%; padding: 0.8rem; background: #ffffff; border: 1px solid rgba(0,0,0,0.15); border-radius: 6px; color: var(--text-main);" required>
        </div>
        
        <div style="margin-bottom: 1.2rem; display: flex; gap: 1rem;">
            <div style="flex: 1;">
                <label style="display: block; margin-bottom: 0.5rem; color: var(--text-muted); font-size: 0.85rem; text-transform: uppercase; letter-spacing: 1px;">Tipo:</label>
                <select name="tipo" style="width: 100%; padding: 0.8rem; background: #ffffff; border: 1px solid rgba(0,0,0,0.15); border-radius: 6px; color: var(--text-main);" required>
                    <option value="INGRESO" {% if cat and cat.tipo == 'INGRESO' %}selected{% endif %}>INGRESO</option>
                    <option value="EGRESO" {% if cat and cat.tipo == 'EGRESO' %}selected{% endif %}>EGRESO</option>
                    <option value="OTRO" {% if cat and cat.tipo == 'OTRO' %}selected{% endif %}>OTRO</option>
                </select>
            </div>
            <div style="flex: 1;">
                <label style="display: block; margin-bottom: 0.5rem; color: var(--text-muted); font-size: 0.85rem; text-transform: uppercase; letter-spacing: 1px;">Emoji:</label>
                <input type="text" name="emoji" value="{{ cat.emoji if cat else '' }}" style="width: 100%; padding: 0.8rem; background: #ffffff; border: 1px solid rgba(0,0,0,0.15); border-radius: 6px; color: var(--text-main);" placeholder="Ej: 🍕">
            </div>
        </div>

        <div style="margin-bottom: 1.2rem;">
            <label style="display: block; margin-bottom: 0.5rem; color: var(--text-muted); font-size: 0.85rem; text-transform: uppercase; letter-spacing: 1px;">Cuenta / Área Asignada:</label>
            <select name="cuenta_codigo" style="width: 100%; padding: 0.8rem; background: #ffffff; border: 1px solid rgba(0,0,0,0.15); border-radius: 6px; color: var(--text-main);">
                <option value="">Ninguna / Sin Asignar</option>
                {% for c in cuentas %}
                <option value="{{ c.codigo }}" {% if (cat and cat.cuenta_codigo == c.codigo) or (not cat and selected_cuenta == c.codigo) %}selected{% endif %}>{{ c.nombre }} {{ c.emoji }}</option>
                {% endfor %}
            </select>
        </div>
        
        <div style="margin-bottom: 2rem;">
            <label style="display: block; margin-bottom: 0.5rem; color: var(--text-muted); font-size: 0.85rem; text-transform: uppercase; letter-spacing: 1px;">Palabras Clave (separadas por coma):</label>
            <textarea name="palabras_clave" style="width: 100%; height: 80px; padding: 0.8rem; background: #ffffff; border: 1px solid rgba(0,0,0,0.15); border-radius: 6px; color: var(--text-main); resize: vertical;" placeholder="Ej: supermercado, coto, despensa">{{ cat.palabras_clave if cat else '' }}</textarea>
            <small style="color:#777; display: block; margin-top: 0.5rem;">El motor buscará estas palabras para auto-asignar el tipo de gasto.</small>
        </div>
        
        <div style="display:flex; gap:1rem;">
            <button type="submit" style="flex:1; background: var(--accent-color, #0969da); color: white; border: none; padding: 0.8rem; border-radius: 6px; font-weight: 600; cursor: pointer; transition: background 0.2s;" onmouseover="this.style.filter='brightness(1.1)'" onmouseout="this.style.filter='none'">Guardar Tipo de Gasto</button>
            <button type="button" style="flex:1; background: #f3f4f6; color: #24292f; border: 1px solid rgba(0,0,0,0.15); padding: 0.8rem; border-radius: 6px; font-weight: 600; cursor: pointer; transition: background 0.2s;" onmouseover="this.style.background='#e5e7eb'" onmouseout="this.style.background='#f3f4f6'" onclick="document.getElementById('modal-container').style.display='none'">Cancelar</button>
        </div>
    </form>
</div>
