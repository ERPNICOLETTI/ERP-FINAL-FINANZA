<td id="card-cat-cell-{{ mov.id }}" hx-target="this" hx-swap="outerHTML">
    <div hx-get="/api/joa/tarjeta/movimientos/{{ mov.id }}/edit_categoria" style="cursor:pointer;display:inline-block;" title="Click para reclasificar">
        <span class="cat-badge cat-{{ (mov.categoria or 'SIN_CATEGORIZAR').replace(' ', '_') }}">{{ mov.emoji or '' }} {{ mov.categoria or 'Sin categorizar' }}</span>
    </div>
</td>
<td id="card-owner-{{ mov.id }}" hx-swap-oob="outerHTML">
    <span style="display:inline-flex;padding:4px 9px;border-radius:999px;background:#eef2f7;color:#475569;font-size:.72rem;font-weight:700;">{{ mov.asignacion }}</span>
</td>
