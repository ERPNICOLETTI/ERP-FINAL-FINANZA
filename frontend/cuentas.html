<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ERP Final - Cuentas Maestras</title>
    <link rel="stylesheet" href="style.css?v=6.0.0">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/htmx.org@1.9.12"></script>
    <script src="table_sort.js"></script>
    <style>
        .cat-badge { padding: 4px 8px; border-radius: 4px; font-size: 0.75rem; font-weight: 600; }
        
        /* Premium Table Styles */
        .glass { background: rgba(255, 255, 255, 0.75); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.05); border: 1px solid rgba(0,0,0,0.05); }
        
        .action-btn {
            background: #ffffff;
            border: 1px solid rgba(0, 0, 0, 0.15);
            color: #24292f;
            padding: 0.4rem 0.8rem;
            border-radius: 6px;
            font-size: 0.8rem;
            cursor: pointer;
            transition: all 0.2s ease;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            margin-left: 0.5rem;
        }
        
        .action-btn:hover {
            background: #f3f4f6;
            transform: translateY(-1px);
            border-color: rgba(0,0,0,0.25);
        }
        
        .btn-delete:hover {
            background: rgba(239, 68, 68, 0.1);
            border-color: rgba(239, 68, 68, 0.3);
            color: #cf222e;
        }
        
        /* Header Fixes */
        .app-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem 2rem;
            background: var(--panel-bg);
            border-bottom: 1px solid var(--glass-border);
        }
    </style>
</head>
<body>
    <div class="app-wrapper">
        <header class="app-header">
            <div class="brand">
                <h1 class="glow-text">ERP <span>Ajustes</span></h1>
                <p>Centro de Clasificación / Cuentas 🏛️</p>
            </div>
            <div class="header-actions">
                <a href="/" class="btn-sync" style="background:#fff; border-color: rgba(0,0,0,0.15); color: #24292f; text-decoration:none; display: inline-flex; align-items: center; gap: 8px;">◀️ Volver al Inicio</a>
                <button class="btn-sync" hx-get="/api/cuentas/form" hx-target="#modal-container" onclick="document.getElementById('modal-container').style.display='flex'">
                    ➕ Nueva Cuenta
                </button>
            </div>
        </header>

        <main style="padding: 2rem; width: 100%; max-width: 1200px; margin: 0 auto;">
            <div style="margin-bottom: 2rem;">
                <h2>Cuentas Maestras / Áreas Financieras 🏛️</h2>
                <p style="color: #888; font-size: 0.9rem;">Ámbitos de distribución de gastos y balances del ERP (Joa, Jor, LDK, En Común).</p>
            </div>
            
            <!-- Lista de Cuentas -->
            <div id="cuentas-list" hx-get="/api/cuentas/list" hx-trigger="load">
                Cargando cuentas...
            </div>
        </main>
        
        <div id="modal-container" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.8); z-index:999; justify-content:center; align-items:center;">
            <!-- Modal content will be loaded here -->
        </div>
    </div>
</body>
</html>
