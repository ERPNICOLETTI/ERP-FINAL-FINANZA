<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ERP Nicoletti - Tesorería y Bancos v6.0</title>
    <link rel="stylesheet" href="style_core.css?v=6.0.0">
    <link rel="stylesheet" href="style_bancos.css?v=6.0.1">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/htmx.org@1.9.12"></script>
    <script src="table_sort.js"></script>
</head>
<body>
    <!-- TOAST CONTAINER SISTEMA NOTIFICACIONES FLOTANTES -->
    <div id="toast-container"></div>

    <div class="app-wrapper">
        <header class="app-header">
            <div class="brand">
                <h1 class="glow-text">ERP <span>Bancos</span></h1>
                <p>Tesorería y Movimientos Financieros v6.0 🏦</p>
            </div>
            <div class="header-actions">
                <a href="index.html" class="btn-sync" style="background:#fff; border-color: rgba(0,0,0,0.15); color: #24292f; text-decoration:none; display: inline-flex; align-items: center; gap: 8px;">◀️ Volver al Dashboard</a>
                <button class="btn-sync" onclick="document.getElementById('bancos-file-upload').click()">⚡ Importar Extracto ⚡</button>
                <input type="file" id="bancos-file-upload" multiple style="display:none" onchange="bancosApp.uploadFiles(this.files)">
            </div>
        </header>

        <main class="ecosystem-layout">
            <section class="boveda-panel-full">
                
                <!-- KPIs Financieros Rápidos -->
                <div class="kpi-row" id="kpi-bancos" hx-get="/api/bancos/kpis" hx-trigger="load, htmx:afterSwap from:#tbody-bancos" hx-include="#filters-form">
                    <div class="kpi-card">
                        <h4>TOTAL INGRESOS 📈</h4>
                        <div class="value monto-ingreso">$ 0,00</div>
                    </div>
                    <div class="kpi-card">
                        <h4>TOTAL EGRESOS 📉</h4>
                        <div class="value monto-egreso">$ 0,00</div>
                    </div>
                    <div class="kpi-card">
                        <h4>FLUJO NETO ⚖️</h4>
                        <div class="value">$ 0,00</div>
                    </div>
                </div>

                <form id="filters-form" hx-get="/api/bancos/movimientos" hx-target="#tbody-bancos" hx-trigger="change, keyup delay:300ms from:#search-bancos, submit">
                    <input type="hidden" id="filter-anio" name="periodo_anio" value="2026">
                    <input type="hidden" id="filter-mes" name="periodo_mes" value="">
                    
                    <!-- Panel de Control y Filtros Consolidado Moderno -->
                    <div class="filter-dashboard glass" style="display: flex; flex-direction: column; gap: 15px; padding: 20px; border-radius: 14px; background: rgba(255, 255, 255, 0.92); border: 1px solid rgba(0,0,0,0.08); box-shadow: 0 4px 20px rgba(0, 0, 0, 0.04); backdrop-filter: blur(12px);">
                        
                        <!-- Fila Superior: Búsqueda, Cuenta y Categoría -->
                        <div style="display: flex; gap: 15px; align-items: center; width: 100%; flex-wrap: wrap;">
                            <div class="search-pro" style="flex: 2; min-width: 280px; margin: 0;">
                                <input type="text" id="search-bancos" name="q" placeholder="🔍 Buscar por descripción o importe exacto..." style="width: 100%; padding: 12px 20px; border-radius: 8px; border: 1px solid rgba(0, 0, 0, 0.15); font-size: 0.95rem; outline: none; background: #fff;">
                            </div>
                            
                            <div style="flex: 1; min-width: 200px;">
                                <select name="cuenta" style="width: 100%; padding: 12px; border-radius: 8px; border: 1px solid rgba(0, 0, 0, 0.15); font-size: 0.95rem; background: #fff; cursor: pointer; outline: none; height: 46px;">
                                    <option value="">Todas las Cuentas</option>
                                    <option value="CA$ ...8342567">Galicia (Caja Ahorro $)</option>
                                    <option value="CC$ ...3762569">Galicia (Cuenta Corriente $)</option>
                                    <option value="CA U$D ...9382561">Galicia (Caja Ahorro U$D)</option>
                                    <option value="CA$ ...00106">Banco Chubut (Caja Ahorro $)</option>
                                    <option value="CC$ ...00201">Banco Chubut (Cuenta Corriente $)</option>
                                    <option value="MERCADOPAGO">Mercado Pago (LDK)</option>
                                    <option value="CA$ ...9087">Hipotecario (Caja Ahorro $ - JOA)</option>
                                    <option value="CA U$D ...2646">Hipotecario (Caja Ahorro U$D - JOA)</option>
                                </select>
                            </div>

                            <div style="flex: 1; min-width: 200px;">
                                <select name="categoria" style="width: 100%; padding: 12px; border-radius: 8px; border: 1px solid rgba(0, 0, 0, 0.15); font-size: 0.95rem; background: #fff; cursor: pointer; outline: none; height: 46px;">
                                    <option value="">Todas las Categorías</option>
                                    <optgroup label="INGRESOS">
                                        <option value="Sueldo">Sueldo 💰</option>
                                        <option value="Ventas">Ventas 🛍️</option>
                                        <option value="Transferencia_recibida">Transferencia Recibida 📲</option>
                                        <option value="Intereses">Intereses 📈</option>
                                        <option value="Inversiones">Inversiones 📊</option>
                                    </optgroup>
                                    <optgroup label="EGRESOS">
                                        <option value="Comida">Comida 🍔</option>
                                        <option value="Transporte">Transporte 🚗</option>
                                        <option value="Vivienda">Vivienda 🏠</option>
                                        <option value="Servicios">Servicios 💡</option>
                                        <option value="Impuestos">Impuestos 📜</option>
                                        <option value="Pago_Tarjeta">Pago Tarjeta 💳</option>
                                        <option value="Tecnología">Tecnología 💻</option>
                                        <option value="Compras">Compras 🛒</option>
                                    </optgroup>
                                </select>
                            </div>
                        </div>

                        <!-- Fila Inferior: Bloques Período (Año / Meses) y Recategorización -->
                        <div style="display: flex; gap: 15px; align-items: center; justify-content: space-between; flex-wrap: wrap; border-top: 1px solid rgba(0,0,0,0.08); padding-top: 15px; width: 100%;">
                            
                            <!-- Bloque Período (Año y Mes) -->
                            <div style="display: flex; gap: 15px; align-items: center; flex-wrap: wrap;">
                                <!-- Selector Año -->
                                <div style="display: inline-flex; background: #eef1f6; padding: 4px; border-radius: 8px; border: 1px solid rgba(0,0,0,0.08); gap: 2px;">
                                    <button type="button" id="btn-bancos-anio-2026" onclick="setBancosYear('2026')" style="padding: 6px 14px; font-size: 0.85rem; font-weight: 600; border-radius: 6px; border: none; background: var(--accent-color); color: #fff; cursor: pointer; transition: 0.2s;">2026</button>
                                    <button type="button" id="btn-bancos-anio-2025" onclick="setBancosYear('2025')" style="padding: 6px 14px; font-size: 0.85rem; font-weight: 600; border-radius: 6px; border: none; background: transparent; color: var(--text-muted); cursor: pointer; transition: 0.2s;">2025</button>
                                </div>

                                <!-- Selector Mes -->
                                <div style="display: inline-flex; background: #eef1f6; padding: 4px; border-radius: 8px; border: 1px solid rgba(0,0,0,0.08); gap: 2px;">
                                    <button type="button" id="btn-bancos-mes-all" onclick="setBancosMonth('')" style="padding: 6px 12px; font-size: 0.85rem; font-weight: 600; border-radius: 6px; border: none; background: var(--accent-color); color: #fff; cursor: pointer;">Todos</button>
                                    <button type="button" id="btn-bancos-mes-01" onclick="setBancosMonth('01')" style="padding: 6px 12px; font-size: 0.85rem; font-weight: 600; border-radius: 6px; border: none; background: transparent; color: var(--text-muted); cursor: pointer;">Ene</button>
                                    <button type="button" id="btn-bancos-mes-02" onclick="setBancosMonth('02')" style="padding: 6px 12px; font-size: 0.85rem; font-weight: 600; border-radius: 6px; border: none; background: transparent; color: var(--text-muted); cursor: pointer;">Feb</button>
                                    <button type="button" id="btn-bancos-mes-03" onclick="setBancosMonth('03')" style="padding: 6px 12px; font-size: 0.85rem; font-weight: 600; border-radius: 6px; border: none; background: transparent; color: var(--text-muted); cursor: pointer;">Mar</button>
                                    <button type="button" id="btn-bancos-mes-04" onclick="setBancosMonth('04')" style="padding: 6px 12px; font-size: 0.85rem; font-weight: 600; border-radius: 6px; border: none; background: transparent; color: var(--text-muted); cursor: pointer;">Abr</button>
                                    <button type="button" id="btn-bancos-mes-05" onclick="setBancosMonth('05')" style="padding: 6px 12px; font-size: 0.85rem; font-weight: 600; border-radius: 6px; border: none; background: transparent; color: var(--text-muted); cursor: pointer;">May</button>
                                    <button type="button" id="btn-bancos-mes-06" onclick="setBancosMonth('06')" style="padding: 6px 12px; font-size: 0.85rem; font-weight: 600; border-radius: 6px; border: none; background: transparent; color: var(--text-muted); cursor: pointer;">Jun</button>
                                </div>
                            </div>

                            <!-- Acciones Múltiples de Recategorización -->
                            <div style="display: flex; gap: 8px; align-items: center;">
                                <span style="font-size: 0.82rem; font-weight: 600; color: #64748b; text-transform: uppercase;">Acción Múltiple:</span>
                                <select id="bulk-cat-select" style="padding: 6px 12px; border-radius: 6px; border: 1px solid rgba(0,0,0,0.15); font-size: 0.85rem; background: #fff;">
                                    <option value="">Seleccionar categoría...</option>
                                    <option value="Comida">Comida 🍔</option>
                                    <option value="Transporte">Transporte 🚗</option>
                                    <option value="Servicios">Servicios 💡</option>
                                    <option value="Impuestos">Impuestos 📜</option>
                                    <option value="Pago_Tarjeta">Pago Tarjeta 💳</option>
                                </select>
                                <button type="button" onclick="bancosApp.bulkCategorize()" style="padding: 6px 14px; font-size: 0.85rem; font-weight: 600; border-radius: 6px; border: none; background: #2563eb; color: #fff; cursor: pointer;">Aplicar a Visibles</button>
                            </div>

                        </div>
                    </div>
                </form>

                <!-- Tabla de Movimientos Bancarios Ultra Elegante -->
                <div class="table-container-final glass">
                    <table id="table-bancos">
                        <thead>
                            <tr>
                                <th>Fecha</th>
                                <th>Cuenta / Banco</th>
                                <th>Descripción del Movimiento</th>
                                <th>Categoría</th>
                                <th>Importe ($)</th>
                                <th>Saldo ($)</th>
                            </tr>
                        </thead>
                        <tbody id="tbody-bancos"
                               hx-get="/api/bancos/movimientos" 
                               hx-trigger="load, change from:#filters-form, keyup changed delay:300ms from:#search-bancos, refresh-table"
                               hx-include="#filters-form"
                               hx-target="this">
                            <!-- HTMX inyectará los movimientos bancarios aquí ✨ -->
                        </tbody>
                    </table>
                </div>

            </section>
        </main>
    </div>

    <!-- SCRIPT DE APLICACIÓN Y NOTIFICACIONES FLOTANTES BANCOS -->
    <script>
        // Función Toast Flotante de Alta Gama
        function showToast(type, message, toastId = null) {
            const container = document.getElementById('toast-container');
            let toast = toastId ? document.getElementById(toastId) : null;

            if (!toast) {
                toast = document.createElement('div');
                toast.className = `toast-card ${type}`;
                if (toastId) toast.id = toastId;
                container.appendChild(toast);
            } else {
                toast.className = `toast-card ${type}`;
            }

            let icon = 'ℹ️';
            if (type === 'loading') {
                icon = '<div class="toast-spinner"></div>';
            } else if (type === 'success') {
                icon = '✅';
            } else if (type === 'error') {
                icon = '⚠️';
            }

            toast.innerHTML = `
                <div style="display:flex; align-items:center; gap:10px;">
                    ${icon}
                    <span>${message}</span>
                </div>
            `;

            setTimeout(() => toast.classList.add('show'), 10);

            if (type !== 'loading') {
                setTimeout(() => {
                    toast.classList.remove('show');
                    setTimeout(() => toast.remove(), 300);
                }, 4000);
            }
            return toast;
        }

        function setBancosYear(year) {
            document.getElementById('filter-anio').value = year;
            document.getElementById('btn-bancos-anio-2026').style.background = (year === '2026') ? 'var(--accent-color)' : 'transparent';
            document.getElementById('btn-bancos-anio-2026').style.color = (year === '2026') ? '#fff' : 'var(--text-muted)';
            document.getElementById('btn-bancos-anio-2025').style.background = (year === '2025') ? 'var(--accent-color)' : 'transparent';
            document.getElementById('btn-bancos-anio-2025').style.color = (year === '2025') ? '#fff' : 'var(--text-muted)';
            document.getElementById('tbody-bancos').dispatchEvent(new Event('refresh-table'));
        }

        function setBancosMonth(month) {
            document.getElementById('filter-mes').value = month;
            const months = ['', '01', '02', '03', '04', '05', '06'];
            months.forEach(m => {
                const btnId = m === '' ? 'btn-bancos-mes-all' : `btn-bancos-mes-${m}`;
                const btn = document.getElementById(btnId);
                if (btn) {
                    btn.style.background = (m === month) ? 'var(--accent-color)' : 'transparent';
                    btn.style.color = (m === month) ? '#fff' : 'var(--text-muted)';
                }
            });
            document.getElementById('tbody-bancos').dispatchEvent(new Event('refresh-table'));
        }

        const bancosApp = {
            async uploadFiles(files) {
                if (!files || files.length === 0) return;

                const toastId = 'toast-upload-' + Date.now();
                showToast('loading', `Procesando ${files.length} extracto(s) bancario(s)...`, toastId);

                const formData = new FormData();
                for (let i = 0; i < files.length; i++) {
                    formData.append('files', files[i]);
                }

                try {
                    const response = await fetch('/api/upload/bancos', {
                        method: 'POST',
                        body: formData
                    });

                    const result = await response.json();

                    if (response.ok) {
                        showToast('success', `✨ Extracto(s) ingestados e integrados con éxito a la Bóveda Raw!`, toastId);
                        document.getElementById('tbody-bancos').dispatchEvent(new Event('refresh-table'));
                    } else {
                        showToast('error', `⚠️ Error al ingestar extracto: ${result.detail || 'Fórmula desconocida'}`, toastId);
                    }
                } catch (err) {
                    showToast('error', `⚠️ Error de conexión al subir extracto: ${err.message}`, toastId);
                } finally {
                    document.getElementById('bancos-file-upload').value = '';
                }
            },

            async bulkCategorize() {
                const cat = document.getElementById('bulk-cat-select').value;
                if (!cat) {
                    showToast('error', 'Por favor selecciona una categoría primero.');
                    return;
                }
                showToast('success', `Aplicando recategorización masiva: ${cat}`);
            }
        };
    </script>
</body>
</html>
