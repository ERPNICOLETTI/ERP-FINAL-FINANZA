<div class="glass" style="width: 500px; padding: 2rem; border-radius: 12px; border: 1px solid rgba(255,255,255,0.1); box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);">
    <h3 style="margin-bottom: 1.5rem; color: #fff; font-weight: 600;">{{ 'Editar Categoría' if cat else 'Nueva Categoría' }}</h3>
    <form hx-post="/api/categorias/save" hx-target="#categorias-list" onsubmit="document.getElementById('modal-container').style.display='none'">
        <input type="hidden" name="id" value="{{ cat.id if cat else '' }}">
        
        <div style="margin-bottom: 1.2rem;">
            <label style="display: block; margin-bottom: 0.5rem; color: #aaa; font-size: 0.85rem; text-transform: uppercase; letter-spacing: 1px;">Nombre:</label>
            <input type="text" name="nombre" value="{{ cat.nombre if cat else '' }}" style="width: 100%; padding: 0.8rem; background: rgba(0,0,0,0.2); border: 1px solid rgba(255,255,255,0.1); border-radius: 6px; color: #fff;" required>
        </div>
        
        <div style="margin-bottom: 1.2rem; display: flex; gap: 1rem;">
            <div style="flex: 1;">
                <label style="display: block; margin-bottom: 0.5rem; color: #aaa; font-size: 0.85rem; text-transform: uppercase; letter-spacing: 1px;">Tipo:</label>
                <select name="tipo" style="width: 100%; padding: 0.8rem; background: rgba(0,0,0,0.2); border: 1px solid rgba(255,255,255,0.1); border-radius: 6px; color: #fff;" required>
                    <option value="INGRESO" {% if cat and cat.tipo == 'INGRESO' %}selected{% endif %}>INGRESO</option>
                    <option value="EGRESO" {% if cat and cat.tipo == 'EGRESO' %}selected{% endif %}>EGRESO</option>
                    <option value="OTRO" {% if cat and cat.tipo == 'OTRO' %}selected{% endif %}>OTRO</option>
                </select>
            </div>
            <div style="flex: 1;">
                <label style="display: block; margin-bottom: 0.5rem; color: #aaa; font-size: 0.85rem; text-transform: uppercase; letter-spacing: 1px;">Emoji:</label>
                <input type="text" name="emoji" value="{{ cat.emoji if cat else '' }}" style="width: 100%; padding: 0.8rem; background: rgba(0,0,0,0.2); border: 1px solid rgba(255,255,255,0.1); border-radius: 6px; color: #fff;" placeholder="Ej: 🍕">
            </div>
        </div>
        
        <div style="margin-bottom: 1.2rem;">
            <label style="display: block; margin-bottom: 0.5rem; color: #aaa; font-size: 0.85rem; text-transform: uppercase; letter-spacing: 1px;">Color CSS (fondo;texto):</label>
            <input type="text" name="color_css" value="{{ cat.color_css if cat else 'rgba(156, 163, 175, 0.2); color: #9ca3af' }}" style="width: 100%; padding: 0.8rem; background: rgba(0,0,0,0.2); border: 1px solid rgba(255,255,255,0.1); border-radius: 6px; color: #fff; font-family: monospace; font-size: 0.8rem;">
        </div>
        
        <div style="margin-bottom: 2rem;">
            <label style="display: block; margin-bottom: 0.5rem; color: #aaa; font-size: 0.85rem; text-transform: uppercase; letter-spacing: 1px;">Palabras Clave (separadas por coma):</label>
            <textarea name="palabras_clave" style="width: 100%; height: 80px; padding: 0.8rem; background: rgba(0,0,0,0.2); border: 1px solid rgba(255,255,255,0.1); border-radius: 6px; color: #fff; resize: vertical;" placeholder="Ej: supermercado, coto, despensa">{{ cat.palabras_clave if cat else '' }}</textarea>
            <small style="color:#777; display: block; margin-top: 0.5rem;">El motor buscará estas palabras para auto-asignar la categoría.</small>
        </div>
        
        <div style="display:flex; gap:1rem;">
            <button type="submit" style="flex:1; background: var(--accent-color, #3b82f6); color: white; border: none; padding: 0.8rem; border-radius: 6px; font-weight: 600; cursor: pointer; transition: background 0.2s;" onmouseover="this.style.filter='brightness(1.1)'" onmouseout="this.style.filter='none'">Guardar Categoría</button>
            <button type="button" style="flex:1; background: rgba(255,255,255,0.1); color: white; border: 1px solid rgba(255,255,255,0.1); padding: 0.8rem; border-radius: 6px; font-weight: 600; cursor: pointer; transition: background 0.2s;" onmouseover="this.style.background='rgba(255,255,255,0.15)'" onmouseout="this.style.background='rgba(255,255,255,0.1)'" onclick="document.getElementById('modal-container').style.display='none'">Cancelar</button>
        </div>
    </form>
</div>
